name: Publish to npm

# Publishes the package when a GitHub release is published, using npm trusted
# publishing (OIDC), without a long-lived npm token in this workflow. Published
# versions get provenance tying them to this repository, workflow and commit.
#
# One-time setup on npmjs.com → package "farvist" → Settings → Trusted publishing:
#   GitHub Actions · owner FloKuersten · repository farvist ·
#   workflow filename publish.yml · environment: (none)
# Until that exists the publish step fails with ENEEDAUTH and nothing is
# published. Details: PUBLISHING.md.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing + provenance
      actions: read   # read this commit's CI check result
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Require a version tag matching package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::publish requires tag v$VERSION; received $GITHUB_REF"
            exit 1
          fi

      - name: Main-branch CI passed on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PASSED="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f branch=main -f event=push -f status=success \
            --jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .head_branch == "main" and .conclusion == "success")] | length > 0')"
          if [ "$PASSED" != "true" ]; then
            echo "::error::main-branch CI has not passed on this commit — publish refused"
            exit 1
          fi

      - name: Install
        run: |
          npm --version
          npm ci

      - name: Build
        run: |
          rm -f dist/*.css
          npm run build:all

      - name: Committed build artifacts are fresh
        run: |
          if [ -n "$(git status --porcelain -- dist ai-context.json llms-full.txt skills ai .well-known context7.json index.html)" ]; then
            git status --porcelain -- dist ai-context.json llms-full.txt skills ai .well-known context7.json index.html
            echo "::error::generated files differ from the tagged commit — run 'npm run build:all' and commit before releasing"
            exit 1
          fi

      - name: Package verified artifacts
        run: npm pack --ignore-scripts

      - name: Publish with provenance
        # A version that is already on npm (e.g. published locally as a fallback)
        # is skipped instead of failing the run.
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::${NAME}@${VERSION} is already on npm — nothing to publish"
            exit 0
          fi
          npm publish "${NAME}-${VERSION}.tgz" --provenance --access public
