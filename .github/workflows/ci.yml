name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Published runtime dependency audit
        run: npm audit --omit=dev --audit-level=low

      - name: Release verification regressions
        run: |
          npm run check:release
          node --test scripts/check-dependency-patch.mjs
          python3 scripts/deploy/check_website.py

      - name: All dependency audit
        run: npm audit --audit-level=low

      - name: CLI and browser safety regressions
        # The runner's installed Chrome has an AppArmor profile permitting its
        # sandbox. Downloaded Chrome for Testing does not on Ubuntu 24.04.
        env:
          PUPPETEER_EXECUTABLE_PATH: /opt/google/chrome/chrome
        run: npm run check:safety

      - name: Build (sass + autoprefixer + ai-context)
        # Delete generated files first so an orphaned dist file (entry renamed
        # but stale output still committed) surfaces as a deletion.
        run: |
          rm -f dist/*.css
          npm run build:all

      - name: Committed build artifacts are fresh
        # Porcelain catches modified, deleted (orphaned) AND untracked outputs —
        # `git diff` alone misses the latter two.
        run: |
          if [ -n "$(git status --porcelain -- dist ai-context.json llms-full.txt skills ai .well-known context7.json '*.html')" ]; then
            git status --porcelain -- dist ai-context.json llms-full.txt skills ai .well-known context7.json '*.html'
            echo "::error::dist/ or generated files are stale, orphaned, or uncommitted — run 'npm run build:all' and commit."
            exit 1
          fi

      - name: Lint (stylelint)
        run: npm run lint

      - name: Bundle-size budget
        run: npm run check:size

      - name: Runtime-theming gate (no baked brand colors)
        run: npm run check:theming

      - name: Skin contrast gate (per-skin WCAG AA)
        run: npm run check:skins

      - name: Documented Sass API (build-time theming compiles)
        run: npm run check:sass-api

      - name: Privacy-page claims match the site
        run: npm run check:privacy

      - name: AI-kit text contrast (rendered, both themes)
        run: npm run check:ai-contrast

      - name: Coloured-text contrast (rendered, every theme + skin, page and glass)
        run: npm run check:text-contrast

      - name: Nested menus readable; navbar paints its own background and radius
        run: npm run check:nested-glass

      - name: Form select keeps an arrow in forced-colors mode
        run: npm run check:forced-colors

      - name: CDN snippets are version-pinned
        run: npm run check:cdn-pins

      - name: npx farvist check — catches planted mistakes, site markup clean
        run: npm run check:validator

      - name: Prompt auto-grow — JS fallback matches native field-sizing
        run: npm run check:prompt-grow

      - name: Accessibility (axe via pa11y-ci)
        run: |
          npx serve -l 4000 . > /dev/null 2>&1 &
          npx wait-on http://localhost:4000 -t 60000
          npx pa11y-ci
