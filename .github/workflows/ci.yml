name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (sass + autoprefixer + ai-context)
        run: npm run build:all

      - name: Committed build artifacts are fresh
        run: |
          git diff --exit-code -- dist ai-context.json llms-full.txt \
            || (echo "::error::dist/ or generated files are stale — run 'npm run build:all' and commit." && exit 1)

      - name: Lint (stylelint)
        run: npm run lint

      - name: Bundle-size budget
        run: npm run check:size

      - name: Runtime-theming gate (no baked brand colors)
        run: npm run check:theming

      - name: Accessibility (axe via pa11y-ci)
        run: |
          npx serve -l 4000 . > /dev/null 2>&1 &
          npx wait-on http://localhost:4000 -t 60000
          npx pa11y-ci
