name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (sass + autoprefixer + ai-context)
        # Delete generated files first so an orphaned dist file (entry renamed
        # but stale output still committed) surfaces as a deletion.
        run: |
          rm -f dist/*.css
          npm run build:all

      - name: Committed build artifacts are fresh
        # Porcelain catches modified, deleted (orphaned) AND untracked outputs —
        # `git diff` alone misses the latter two.
        run: |
          if [ -n "$(git status --porcelain -- dist ai-context.json llms-full.txt)" ]; then
            git status --porcelain -- dist ai-context.json llms-full.txt
            echo "::error::dist/ or generated files are stale, orphaned, or uncommitted — run 'npm run build:all' and commit."
            exit 1
          fi

      - name: Lint (stylelint)
        run: npm run lint

      - name: Bundle-size budget
        run: npm run check:size

      - name: Runtime-theming gate (no baked brand colors)
        run: npm run check:theming

      - name: Skin contrast gate (per-skin WCAG AA)
        run: npm run check:skins

      - name: Documented Sass API (build-time theming compiles)
        run: npm run check:sass-api

      - name: Privacy-page claims match the site
        run: npm run check:privacy

      - name: AI-kit text contrast (rendered, both themes)
        run: npm run check:ai-contrast

      - name: Accessibility (axe via pa11y-ci)
        run: |
          npx serve -l 4000 . > /dev/null 2>&1 &
          npx wait-on http://localhost:4000 -t 60000
          npx pa11y-ci
