<!-- Farvist Pro - Newsletter CTA (SAMPLE) - requires dist/farvist.css -->
<section class="container py-8">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-4 mx-auto">
      <div class="card card-glow glass-strong rounded-xl shadow-xl text-center p-7">
        <div class="card-body">
          <span class="badge badge-soft-accent rounded-pill mb-4">
            <svg class="icon" aria-hidden="true"><use href="assets/icons/farvist-icons.svg#i-mail"/></svg>
            Newsletter
          </span>
          <h2 class="fs-3xl fw-bold text-gradient-aurora mb-3">Stay in the loop</h2>
          <p class="text-muted fs-lg mb-5">
            Get product updates, fresh tips, and the occasional deep dive delivered
            straight to your inbox. One concise email each week, no spam ever.
          </p>
          <form class="input-group mb-3">
            <label for="newsletter-email" class="d-none">Email address</label>
            <span class="input-group-text rounded-md" aria-hidden="true">
              <svg class="icon"><use href="assets/icons/farvist-icons.svg#i-mail"/></svg>
            </span>
            <input
              type="email"
              id="newsletter-email"
              class="form-control"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
            <button type="submit" class="btn btn-gradient-primary glow-primary">
              Subscribe
              <svg class="icon" aria-hidden="true"><use href="assets/icons/farvist-icons.svg#i-arrow-right"/></svg>
            </button>
          </form>
          <p class="text-muted fs-sm d-flex align-items-center justify-content-center gap-2 mb-0">
            <svg class="icon" aria-hidden="true"><use href="assets/icons/farvist-icons.svg#i-check"/></svg>
            We respect your privacy. Unsubscribe at any time.
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
