# Include inside each server serving Farvist (HTTP, HTTPS and any legacy root).
# Return-only rewrite guards also protect ACME's ^~ location and run before
# static HTML handling. They do not alter legitimate ACME challenge tokens.
if ($uri ~ "(^|/)\.(?!well-known(?:/|$))") { return 404; }
if ($uri ~* "\.(?:php[0-9]*|phtml|phar|py|pyc|sh|ps1|cgi|pl|rb|asp|aspx|jsp|env|ini|conf|config|sql|sqlite[0-9]*|db|bak|backup|old|orig|save|swp|swo|key|pem|p12|pfx|map)(?:[./~]|$)|~$") { return 404; }
if ($uri ~* "(?:^|/)(?:package(?:-lock)?\.json|composer\.(?:json|lock)|yarn\.lock|pnpm-lock\.yaml)(?:[./~]|$)") { return 404; }
autoindex off;
