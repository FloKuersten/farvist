<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Farvist nested-glass fixture</title>
  <link rel="stylesheet" href="../../dist/farvist.css" />
  <style>
    /* A deliberately busy, high-contrast backdrop: stripes a frosted surface
       must smear out. Unfrosted glass leaves them sharp behind the text. */
    body { background: repeating-linear-gradient(90deg, #000 0 6px, #fff 6px 12px) !important; }
    .probe { position: absolute; width: 220px; height: 60px; }
  </style>
</head>
<body>
  <nav class="navbar" style="position:relative; z-index:5;">
    <a class="navbar-brand" href="#">Brand</a>
    <details class="dropdown" open>
      <summary class="btn btn-glass btn-sm">Menu</summary>
      <div class="dropdown-menu" id="nested"><a class="dropdown-item" href="#">Item one</a><a class="dropdown-item" href="#">Item two</a><a class="dropdown-item" href="#">Item three</a></div>
    </details>
  </nav>
  <div class="card" style="margin:220px 0 0 40px; width:420px;"><div class="card-body" style="height:180px;">
    <details class="dropdown" open>
      <summary class="btn btn-glass btn-sm">Card menu</summary>
      <div class="dropdown-menu" id="in-card"><a class="dropdown-item" href="#">Item one</a><a class="dropdown-item" href="#">Item two</a></div>
    </details>
  </div></div>
  <div class="glass" id="standalone" style="position:absolute; left:560px; top:260px; width:220px; height:110px; border-radius:12px;"></div>
  <!-- Unfrosted control: the same translucent fill with NO backdrop-filter. Anchors
       the "not frosted" end of the scale on whatever renderer runs the gate. -->
  <div id="unfrosted" style="position:absolute; left:560px; top:400px; width:220px; height:110px; border-radius:12px; background-color:var(--fv-glass-bg);"></div>
  <!-- The navbar must paint what authors put on it. On a plain black panel: an
       opaque background utility, an inline background, and a rounded bar. Shadows
       are off: a bar's shadow would shade the next bar's corner, which must stay
       the panel's black outside the curve (dark-theme glass is a white tint, invisible on white). -->
  <div id="panel" style="position:absolute; left:40px; top:580px; width:460px; padding:16px; background:#000;">
    <nav class="navbar bg-dark shadow-none" id="nav-bg"><a class="navbar-brand" href="#">Utility</a></nav>
    <nav class="navbar shadow-none mt-3" id="nav-inline" style="background-color:rgb(20,120,60);"><a class="navbar-brand" href="#">Inline</a></nav>
    <nav class="navbar rounded-2xl shadow-none mt-3" id="nav-round"><a class="navbar-brand" href="#">Rounded</a></nav>
  </div>
</body>
</html>
